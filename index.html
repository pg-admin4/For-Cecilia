<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers for Cecilia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0f18;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Starry Background Effect */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)), radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .headline {
            font-size: 2.2rem;
            letter-spacing: 6px;
            font-weight: bold;
            min-height: 3rem;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
        }

        /* Interactive Button */
        .btn-open {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

            .btn-open:hover {
                background: rgba(255, 255, 255, 0.3);
                box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
                transform: scale(1.05);
            }

        .hidden {
            display: none;
        }

        /* Flower Vector / Canvas Container */
        .flower-svg {
            width: 280px;
            height: 320px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 2s ease, transform 2s ease;
        }

            .flower-svg.show {
                opacity: 1;
                transform: translateY(0);
            }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <!-- Screen 1: Initial Prompt -->
        <div id="step-1">
            <h1 class="headline" id="title-1"></h1>
            <button class="btn-open" id="open-btn">✨ Open ✨</button>
        </div>

        <!-- Screen 2: Final Reveal -->
        <div id="step-2" class="hidden">
            <h1 class="headline" id="title-2"></h1>

            <!-- Flower Illustration -->
            <svg class="flower-svg" id="flower" viewBox="0 0 200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Grass Stems -->
                <path d="M 100 250 Q 80 180 50 120" stroke="#4a7c59" stroke-width="4" stroke-linecap="round" />
                <path d="M 100 250 Q 100 160 100 80" stroke="#4a7c59" stroke-width="5" stroke-linecap="round" />
                <path d="M 100 250 Q 120 180 150 120" stroke="#4a7c59" stroke-width="4" stroke-linecap="round" />

                <!-- Leaves -->
                <path d="M 100 210 Q 60 200 40 220 Q 70 180 100 210" fill="#3b6346" />
                <path d="M 100 190 Q 140 180 160 200 Q 130 160 100 190" fill="#3b6346" />

                <!-- Left Flower Petals -->
                <circle cx="50" cy="120" r="18" fill="#fefefe" />
                <circle cx="40" cy="110" r="14" fill="#f0f0f0" />
                <circle cx="60" cy="110" r="14" fill="#f0f0f0" />
                <circle cx="50" cy="120" r="8" fill="#fcd34d" />

                <!-- Center Main Flower Petals -->
                <circle cx="100" cy="80" r="24" fill="#ffffff" />
                <circle cx="85" cy="68" r="18" fill="#f5f5f5" />
                <circle cx="115" cy="68" r="18" fill="#f5f5f5" />
                <circle cx="85" cy="92" r="18" fill="#f5f5f5" />
                <circle cx="115" cy="92" r="18" fill="#f5f5f5" />
                <circle cx="100" cy="80" r="12" fill="#fbbf24" />

                <!-- Right Flower Petals -->
                <circle cx="150" cy="120" r="18" fill="#fefefe" />
                <circle cx="140" cy="110" r="14" fill="#f0f0f0" />
                <circle cx="160" cy="110" r="14" fill="#f0f0f0" />
                <circle cx="150" cy="120" r="8" fill="#fcd34d" />
            </svg>
        </div>
    </div>

    <script>
    const text1 = "I H A V E  S O M E T H I N G FOR YOU";
    const text2 = "HAPPY GIRLFRIENDS DAY, CECILIA ✨";

    const title1El = document.getElementById('title-1');
    const title2El = document.getElementById('title-2');
    const openBtn = document.getElementById('open-btn');
    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const flower = document.getElementById('flower');

    // Typewriter effect for step 1
    let index1 = 0;
    function typeText1() {
      if (index1 < text1.length) {
        title1El.textContent += text1.charAt(index1);
        index1++;
        setTimeout(typeText1, 100);
      }
    }

    // Typewriter effect for step 2
    let index2 = 0;
    function typeText2() {
      if (index2 < text2.length) {
        title2El.textContent += text2.charAt(index2);
        index2++;
        setTimeout(typeText2, 90);
      } else {
        // Reveal flower after text finishes typing
        flower.classList.add('show');
      }
    }

    // On Button Click
    openBtn.addEventListener('click', () => {
      step1.classList.add('hidden');
      step2.classList.remove('hidden');
      typeText2();
    });

    // Start initial animation
    window.onload = typeText1;
    </script>
</body>
</html>
